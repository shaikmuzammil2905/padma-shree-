<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#0F4C81" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F4C81" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Icon Mark Group -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Outer Shield / Global Ring -->
    <circle cx="50" cy="50" r="46" fill="url(#blueGrad)" />
    <circle cx="50" cy="50" r="42" fill="#0A2540" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Globe Longitude & Latitude Lines -->
    <ellipse cx="50" cy="50" rx="36" ry="18" stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.6"/>
    <ellipse cx="50" cy="50" rx="18" ry="36" stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.6"/>
    <line x1="14" y1="50" x2="86" y2="50" stroke="#38BDF8" stroke-width="1.2" opacity="0.7"/>

    <!-- Ocean Wave / Marine Dynamic Swoosh -->
    <path d="M22 62 C34 50, 48 72, 64 56 C74 46, 78 50, 84 54 C74 66, 56 68, 44 76 C32 82, 24 74, 22 62 Z" fill="#0284C7" opacity="0.85"/>

    <!-- Agro / Kewda Botanical Leaf Emblem -->
    <path d="M50 20 C64 26, 72 40, 68 56 C60 52, 54 44, 50 36 C46 44, 40 52, 32 56 C28 40, 36 26, 50 20 Z" fill="url(#greenGrad)"/>
    <line x1="50" y1="20" x2="50" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Golden Star / Trade Compass Sparkle -->
    <polygon points="50,14 52.5,20 58.5,21.5 54,25.5 55.5,31.5 50,28 44.5,31.5 46,25.5 41.5,21.5 47.5,20" fill="url(#goldGrad)"/>
    
    <!-- Inner Drop / Essence Bead -->
    <circle cx="50" cy="64" r="5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="125" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#0A2540">
    PADMASRI
  </text>
  <text x="310" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="#059669">
    GLOBAL
  </text>
  
  <!-- Sub Brand -->
  <text x="126" y="80" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#0284C7">
    EXPORTS &amp; IMPORTS
  </text>

  <!-- Origin & Certification Tag -->
  <g transform="translate(126, 92)">
    <rect x="0" y="0" width="220" height="18" rx="9" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="9" cy="9" r="4" fill="#10B981"/>
    <text x="18" y="13" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="9" letter-spacing="1" fill="#065F46">
      GANJAM, ODISHA • APEDA • MPEDA • HALAL
    </text>
  </g>
</svg>
